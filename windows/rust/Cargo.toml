[package]
name = "openvpn_flutter_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "openvpn_flutter_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "net"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.8"
chrono = "0.4"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Services"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

